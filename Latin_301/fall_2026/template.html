    <!-- Alpheios Initialization Script -->

        document.addEventListener("DOMContentLoaded", function(event) {
            import('https://cdn.jsdelivr.net/npm/alpheios-embedded@beta/dist/alpheios-embedded.js').then(embedLib => {
                window.AlpheiosEmbed.importDependencies({ 
                    mode: 'custom', 
                    libs: {
                        components: 'https://cdn.jsdelivr.net/npm/alpheios-components@beta/dist/alpheios-components.js' 
                    }
                }).then(Embedded => {
                    new Embedded({clientId: 'embed-lib-demo-treebanks', authEnv: null}).activate();
                }).catch(e => {
                    console.error(`Import of embedded library dependencies failed: ${e}`);
                });
            }).catch(e => {
                console.error(`Import of embedded library failed: ${e}`);
            });
